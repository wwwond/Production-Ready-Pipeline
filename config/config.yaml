# ─────────────────────────────────────────
#  PRP - Precision Realtime Pipeline
#  제조 공정 이상 탐지 시스템 설정 파일
# ─────────────────────────────────────────

project:
  name: "PRP"
  version: "1.1.0"

# 데이터 경로
data:
  root: "data/mvtec"
  category: "carpet"          # 실험할 카테고리
  image_size: 256             # 리사이즈 크기
  train_dir: "train/good"     # 정상 이미지만
  test_dir: "test"

# 결과 저장 경로
results:
  heatmaps: "results/heatmaps"
  metrics: "results/metrics"
  checkpoints: "results/checkpoints"

# 모델 공통 설정
model:
  current: "patchcore"      # "autoencoder" or "patchcore" 선택
  threshold: null              # anomaly score 임계값 

# AutoEncoder 설정
autoencoder:
  epochs: 300
  batch_size: 32
  learning_rate: 0.0001
  latent_channels: 512      # 벡터가 아니라 채널 수
  normalize: false          
  score_reduction: "max"

# PatchCore 설정
patchcore:
  backbone: "wide_resnet50_2"
  layers: ["layer2", "layer3"]
  coreset_ratio: 0.01          # memory bank 크기 비율
  neighborhood_size: 3

# Kafka 설정
kafka:
  bootstrap_servers: "kafka:9092"
  topic: "anomaly-detection"
  group_id: "prp-consumer"
  dlq_topic: "anomaly-detection-dlq" 

# DB 설정
database:
  url: "postgresql://prp_user:prp_pass@postgres:5432/prp_db"

# FastAPI 설정
api:
  host: "0.0.0.0"
  port: 8000
  reload: true